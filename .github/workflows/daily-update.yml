name: 每日股票數據更新 + 部署

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      full_fetch:
        description: '完整季度抓取（含FinMind財務資料）'
        type: boolean
        default: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: 抓取 TWSE 每日數據
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FULL_FETCH: ${{ github.event.inputs.full_fetch || 'false' }}
        run: |
          python scripts/fetcher.py \
            --token "$FINMIND_TOKEN" \
            $([ "$FULL_FETCH" = "true" ] && echo "--full" || echo "")

      - name: Commit 數據更新
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/stock_data.js data/fetch_log.txt
          git diff --cached --quiet || \
            git commit -m "📊 $(date '+%Y-%m-%d %H:%M') 自動更新股市數據"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
